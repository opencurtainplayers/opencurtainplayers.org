name: Test and deploy Astro to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and types
        run: npm run format:check && npm run check
      - name: Unit tests and production build
        run: npm test && npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Functional and first-party WCAG 2.1 A/AA tests
        run: npm run test:e2e
      - name: Upload browser and accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-and-accessibility-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
