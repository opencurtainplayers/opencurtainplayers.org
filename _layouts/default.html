<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --black: #050505;
        --gold: #e7c778;
        --gold-bright: #f8e7ac;
        --text: #231f1b;
        --muted: #625b52;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #fff;
        color: var(--text);
        font-family: "Source Serif 4", Georgia, serif;
        line-height: 1.7;
      }

      .site-header {
        position: relative;
        background: var(--black);
        border-bottom: 1px solid #5c481f;
      }

      .site-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 6rem;
        padding: 0 2rem 0 0;
      }

      .site-logo {
        display: block;
        flex: 0 1 20rem;
        max-width: 50vw;
        line-height: 0;
      }

      .site-logo img {
        display: block;
        width: 100%;
        height: auto;
      }

      .site-nav ul {
        display: flex;
        justify-content: center;
        gap: clamp(1.25rem, 5vw, 4.5rem);
        margin: 0;
        padding: 1rem 0;
        list-style: none;
      }

      .site-nav li a {
        position: relative;
        display: inline-block;
        color: var(--gold);
        font-family: "Cinzel", "Times New Roman", serif;
        font-size: clamp(0.75rem, 1.5vw, 0.95rem);
        font-weight: 600;
        letter-spacing: 0.15em;
        text-decoration: none;
        text-transform: uppercase;
        transition:
          color 180ms ease,
          transform 180ms ease;
      }

      .site-nav li a::after {
        position: absolute;
        right: 0;
        bottom: -0.35rem;
        left: 0;
        height: 1px;
        background: currentColor;
        content: "";
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 180ms ease;
      }

      .site-nav li a:hover,
      .site-nav li a:focus-visible {
        color: var(--gold-bright);
        transform: translateY(-2px);
      }

      .site-nav li a:hover::after,
      .site-nav li a:focus-visible::after {
        transform: scaleX(1);
      }

      .site-nav li a:focus-visible {
        outline: 2px solid var(--gold-bright);
        outline-offset: 0.5rem;
      }

      .page {
        width: min(100% - 2rem, 72rem);
        margin: 0 auto;
        padding: clamp(2.5rem, 7vw, 5rem) 0;
      }

      .section-heading {
        margin: 0 0 2rem;
        color: var(--text);
        font-family: "Cinzel", "Times New Roman", serif;
        font-size: clamp(1.75rem, 4vw, 3rem);
        line-height: 1.1;
        text-align: center;
        text-transform: uppercase;
      }

      .section-heading::after {
        display: block;
        width: 3.5rem;
        height: 2px;
        margin: 0.85rem auto 0;
        background: #b6913f;
        content: "";
      }

      .about {
        max-width: 48rem;
        margin: clamp(3.5rem, 8vw, 6rem) auto 0;
        padding-top: clamp(2.5rem, 5vw, 4rem);
        border-top: 1px solid #dfd8ca;
        text-align: center;
      }

      .about p {
        margin-inline: auto;
      }

      p {
        margin: 0;
        color: var(--text);
        font-size: clamp(1.05rem, 1.5vw, 1.2rem);
        max-width: 68ch;
      }

      p + p {
        margin-top: 1rem;
      }

      strong {
        color: #795d22;
      }

      @media (max-width: 680px) {
        .site-nav {
          min-height: 5rem;
          padding-right: 1rem;
        }

        .site-logo {
          flex-basis: 11rem;
          max-width: 42vw;
        }

        .site-nav ul {
          gap: 0.8rem;
        }

        .site-nav li a {
          font-size: 0.68rem;
          letter-spacing: 0.1em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .site-nav li a,
        .site-nav li a::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body id="top">
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-logo" href="#top" aria-label="Open Curtain Players home">
          <img
            src="{{ '/images/logo.png' | relative_url }}"
            alt=""
            width="1024"
            height="559"
          />
        </a>
        <ul>
          <li><a href="#top">Home</a></li>
          <li><a href="#tickets">Tickets</a></li>
          <li><a href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page">
      <section id="tickets" aria-labelledby="tickets-heading">
        <h1 id="tickets-heading" class="section-heading">Tickets</h1>
        <script type="text/javascript">
          var subdomain = "opencurtainplayers"; //Site Subdomain
          var showID="200545825"; //Provide showID if you want to list one specific event
          var sections = "events"; //'all' = events & collections; 'events' = only events; 'collections' = only Collections; 'classes' = only Classes
          var categoryID = ""; //Provide category ID if you want to load events or Classes from a specific category
          var hideNav = "true"; //'false' = top navigation will be shown on widget load; 'true' = navigation will be hidden
          var width = "100%"; //Setting to 100% allows widget to resize automatically
        </script>
        <script type="text/javascript" src="https://opencurtainplayers.ludus.com/widget.js"></script>
      </section>
      <section id="about" class="about" aria-labelledby="about-heading">
        <h2 id="about-heading" class="section-heading">About Us</h2>
        {{ content }}
      </section>
    </main>
  </body>
</html>
